#!/usr/bin/env bash
set -e

echo "==> Setting up local.properties"
echo "sdk.dir=$ANDROID_HOME" > local.properties
cat local.properties

echo "==> Creating directories"
mkdir -p app/src/main/java/ir/bluecoffenet/app
mkdir -p app/src/main/res/xml

echo "==> Creating settings.gradle.kts"
cat > settings.gradle.kts << 'GRADLE_SETTINGS_END'
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories { google(); mavenCentral() }
}
rootProject.name = "BlueCoffeNet"
include(":app")
GRADLE_SETTINGS_END

echo "==> Creating build.gradle.kts"
cat > build.gradle.kts << 'GRADLE_BUILD_END'
plugins {
    id("com.android.application") version "8.5.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}
GRADLE_BUILD_END

echo "==> Creating gradle.properties"
cat > gradle.properties << 'GRADLE_PROPS_END'
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
GRADLE_PROPS_END

echo "==> Creating app/build.gradle.kts"
cat > app/build.gradle.kts << 'APP_BUILD_END'
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "ir.bluecoffenet.app"
    compileSdk = 34
    defaultConfig {
        applicationId = "ir.bluecoffenet.app"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}
APP_BUILD_END

echo "==> Creating AndroidManifest.xml"
cat > app/src/main/AndroidManifest.xml << 'MANIFEST_END'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:allowBackup="false"
        android:label="BlueCoffeNet"
        android:usesCleartextTraffic="false"
        android:networkSecurityConfig="@xml/network_security_config"
        android:theme="@android:style/Theme.Material.Light.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:configChanges="orientation|screenSize|keyboardHidden"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
MANIFEST_END

echo "==> Creating network_security_config.xml"
cat > app/src/main/res/xml/network_security_config.xml << 'NSC_END'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false">
        <trust-anchors>
            <certificates src="system" />
        </trust-anchors>
    </base-config>
</network-security-config>
NSC_END

echo "==> Creating MainActivity.kt"
cat > app/src/main/java/ir/bluecoffenet/app/MainActivity.kt << 'MAIN_END'
package ir.bluecoffenet.app

import android.annotation.SuppressLint
import android.app.Activity
import android.content.Intent
import android.graphics.Bitmap
import android.net.http.SslError
import android.os.Bundle
import android.view.View
import android.view.ViewGroup
import android.webkit.*
import android.widget.FrameLayout
import android.widget.ProgressBar

class MainActivity : Activity() {
    private val homeUrl = "https://bluecoffenet.ir"
    private val allowedHost = "bluecoffenet.ir"
    private lateinit var webView: WebView
    private lateinit var progressBar: ProgressBar

    @SuppressLint("SetJavaScriptEnabled")
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val root = FrameLayout(this)
        webView = WebView(this).apply {
            layoutParams = FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
        }
        root.addView(webView)
        progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
            max = 100
            visibility = View.GONE
            layoutParams = FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT, 8
            )
        }
        root.addView(progressBar)
        setContentView(root)

        webView.settings.apply {
            javaScriptEnabled = true
            domStorageEnabled = true
            allowFileAccess = false
            allowContentAccess = false
            @Suppress("DEPRECATION") allowFileAccessFromFileURLs = false
            @Suppress("DEPRECATION") allowUniversalAccessFromFileURLs = false
            mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
            safeBrowsingEnabled = true
            setGeolocationEnabled(false)
            javaScriptCanOpenWindowsAutomatically = false
            setSupportMultipleWindows(false)
        }
        WebView.setWebContentsDebuggingEnabled(false)

        webView.webViewClient = object : WebViewClient() {
            override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                val uri = request.url
                val isOwnSite = uri.scheme == "https" &&
                    (uri.host == allowedHost || uri.host?.endsWith(".$allowedHost") == true)
                if (isOwnSite) return false
                if (uri.scheme in listOf("https", "mailto", "tel")) {
                    try { startActivity(Intent(Intent.ACTION_VIEW, uri)) } catch (_: Exception) {}
                }
                return true
            }
            override fun onReceivedSslError(view: WebView, handler: SslErrorHandler, error: SslError) {
                handler.cancel()
                showError(view)
            }
            override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                if (request.isForMainFrame) showError(view)
            }
            override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                progressBar.visibility = View.VISIBLE
            }
            override fun onPageFinished(view: WebView?, url: String?) {
                progressBar.visibility = View.GONE
            }
        }
        webView.webChromeClient = object : WebChromeClient() {
            override fun onPermissionRequest(request: PermissionRequest) = request.deny()
            override fun onGeolocationPermissionsShowPrompt(origin: String, callback: android.webkit.GeolocationPermissions.Callback) = callback.invoke(origin, false, false)
            override fun onProgressChanged(view: WebView?, newProgress: Int) {
                progressBar.progress = newProgress
                progressBar.visibility = if (newProgress in 1..99) View.VISIBLE else View.GONE
            }
        }
        CookieManager.getInstance().setAcceptThirdPartyCookies(webView, false)
        if (savedInstanceState == null) webView.loadUrl(homeUrl)
        else webView.restoreState(savedInstanceState)
    }
    private fun showError(view: WebView) {
        val html = "<html><body dir='rtl' style='text-align:center;margin-top:30%;font-family:sans-serif'><h3>Connection Error</h3><p>Please check your internet connection and try again.</p></body></html>"
        view.loadData(html, "text/html; charset=utf-8", "UTF-8")
    }
    @Deprecated("Deprecated in Java")
    override fun onBackPressed() {
        if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
    }
    override fun onSaveInstanceState(outState: Bundle) {
        super.onSaveInstanceState(outState)
        webView.saveState(outState)
    }
    override fun onDestroy() {
        webView.destroy()
        super.onDestroy()
    }
}
MAIN_END

echo "==> All files created"
ls -la

echo "==> Starting Gradle build"
gradle assembleDebug --no-daemon --stacktrace

echo "==> Build complete!"
ls -lh app/build/outputs/apk/debug/
